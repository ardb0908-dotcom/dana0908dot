<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도트 라이프 게임</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4f8;--card:#fff;--ink:#4a3b52;--sub:#9a8aa3;--pink:#ff8fb8;--mint:#7fe0c3;--line:#f3d9e6;--shadow:#f3c4d9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a28;--card:#2b2438;--ink:#f4e9f7;--sub:#a99bb5;--line:#3d3350;--shadow:#161220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo',sans-serif;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{max-width:440px;margin:0 auto;padding:14px 14px 40px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--shadow);padding:14px;margin-bottom:14px}
.stage{aspect-ratio:4/3;border-radius:12px;border:3px solid var(--ink);overflow:hidden;position:relative;background:#eee}
.stage>img.bgi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.char{position:absolute;left:50%;bottom:2%;height:80%;transform:translateX(-50%)}
.char img{image-rendering:pixelated;height:100%;display:block}
.a1 img.base{filter:drop-shadow(0 0 2px #fff)}.a2 img.base{filter:drop-shadow(0 0 4px #ffd13d)}.a3 img.base{animation:rb 2s linear infinite}
@keyframes rb{0%{filter:drop-shadow(0 0 5px #ff5f8f)}33%{filter:drop-shadow(0 0 5px #ffd13d)}66%{filter:drop-shadow(0 0 5px #6ea8ff)}100%{filter:drop-shadow(0 0 5px #ff5f8f)}}
.sp{position:absolute;font-size:16px;animation:tw 1.6s infinite;color:#ffd13d}@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.bounce{animation:b .5s}@keyframes b{0%,100%{transform:translateX(-50%) translateY(0)}40%{transform:translateX(-50%) translateY(-22px)}}
.pop{position:absolute;top:22%;left:50%;font-family:'DotGothic16',monospace;color:#fff;text-shadow:2px 2px 0 #4a3b52;font-size:24px;animation:u 1s forwards;transform:translateX(-50%);pointer-events:none;white-space:nowrap}
@keyframes u{to{transform:translate(-50%,-50px);opacity:0}}
.top{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px}.lv{font-family:'DotGothic16',monospace;font-size:18px}
.bar{height:16px;border:3px solid var(--ink);border-radius:10px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),#ffd666);width:0;transition:width .4s}
.stats{display:flex;gap:8px;margin-top:10px}.stat{flex:1;background:var(--bg);border-radius:12px;padding:6px 8px;font-size:13px;color:var(--sub)}
.stat b{display:block;font-family:'DotGothic16',monospace;font-size:18px;color:var(--ink)}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1}
.btn{border:3px solid var(--ink);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;padding:6px 10px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}.btn.on{background:var(--pink);color:#fff}.btn.m{background:var(--mint);color:#2b2438}.btn:disabled{opacity:.4}
h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:12px 0 6px;color:var(--sub)}
.q{display:flex;align-items:center;gap:10px;padding:10px;border:2px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--card);width:100%;text-align:left;color:var(--ink);font:inherit}
.q .box{width:26px;height:26px;border:3px solid var(--ink);border-radius:8px;flex:none;display:grid;place-items:center}
.q.done{opacity:.55;background:var(--bg)}.q.done .box{background:var(--mint)}.q.done .nm{text-decoration:line-through}
.q .nm{flex:1}.q .xp{font-family:'DotGothic16',monospace;color:var(--pink);font-size:14px}
.add{display:flex;gap:6px;margin-top:8px}.add input{min-width:0;border:2px solid var(--line);border-radius:10px;padding:8px;font:inherit;background:var(--bg);color:var(--ink)}
.add .n{flex:1}.add .x{width:60px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:6px;padding:5px;border-radius:10px}.row.me{background:var(--line)}.row .nm{flex:1}
.row img{width:44px;height:44px;image-rendering:pixelated;object-fit:cover;object-position:50% 0;background:var(--bg);border-radius:8px}
.row img.body{object-position:50% 92%}.row img.face{object-position:50% 38%}.row img.it{object-fit:contain;object-position:center;padding:6px}
.places{display:flex;gap:6px;margin-bottom:12px}.places button{flex:1;padding:6px 2px;font-size:13px}.note{font-size:12px;color:var(--sub);margin:8px 0 0;line-height:1.5}.hide{display:none}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:20px}.dlg .card{max-width:320px;width:100%;text-align:center;margin:0}.dlg p{margin:4px 0 14px;font-size:17px}.dlg .bs{display:flex;gap:8px;justify-content:center}
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="stage" id="stage"><img class="bgi" id="bgi" alt=""><div class="char" id="char"></div></div>
    <div class="top"><span class="lv" id="lv"></span><button class="btn" id="bgm">🎵 BGM 끔</button></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="stats"><div class="stat">포인트<b id="coins">0</b></div><div class="stat">연속<b id="streak">0일</b></div><div class="stat">오늘<b id="today">0/0</b></div></div>
  </div>
  <div class="tabs"><button class="btn on" data-t="q">퀘스트</button><button class="btn" data-t="s">옷장·상점</button><button class="btn" data-t="r">랭킹</button></div>
  <section id="t-q" class="card"><div class="places" id="places"></div><h2 id="qh"></h2><div id="quests"></div>
    <div class="add"><input class="n" id="qn" placeholder="새 퀘스트" maxlength="20"><input class="x" id="qx" type="number" value="10" min="1"><button class="btn m" id="qadd">추가</button></div>
    <p class="note">장소를 누르면 배경이 바뀌고 그 장소의 퀘스트가 나와요. 장소 퀘스트를 모두 끝내면 보너스 +10XP! 퀘스트를 길게 누르면 삭제돼요.</p></section>
  <section id="t-s" class="card hide"><h2>👗 옷장·상점</h2>
    <h3>상의</h3><div id="s-top"></div><h3>하의</h3><div id="s-bot"></div><h3>원피스</h3><div id="s-dress"></div><h3>표정</h3><div id="s-face"></div><h3>악세서리</h3><div id="s-acc"></div>
    <p class="note">상의·하의를 입으면 원피스를 벗고, 원피스를 입으면 상·하의 대신 원피스로 바뀌어요. 표정은 무료예요. 악세서리는 한 번 더 누르면 벗어요.</p></section>
  <section id="t-r" class="card hide"><h2>🏆 랭킹</h2>
    <div class="add"><input class="n" id="nick" maxlength="10" placeholder="내 닉네임"><button class="btn m" id="nsave">저장</button></div>
    <div id="rank" style="margin-top:10px"></div><p class="note" id="rnote"></p></section>
  <button class="btn" id="reset" style="display:block;margin:0 auto;font-size:12px;box-shadow:none">데이터 초기화</button>
</div>

const IMG={};let imgsReady=0;
function loadImg(k,src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src}).then(i=>IMG[k]=i)}

const SPR={};
function codeOf(w){return (w.mode==='dress'?'d:'+w.dress:'s:'+w.top+':'+w.bot)+'|'+(w.face||'smile')}
function sprite(code,accs){
  const key=code+'|'+(accs||[]).join(',');if(SPR[key])return SPR[key];
  const c=document.createElement('canvas');c.width=56;c.height=95;const g=c.getContext('2d');
  const [cl,fc]=String(code||'').split('|'),p=cl.split(':');
  IMG.base&&g.drawImage(IMG.base,0,0);
  if(p[0]==='d'){const d=IMG['d_'+p[1]]||IMG.d_black;d&&g.drawImage(d,0,0)}
  else{const b=IMG['b_'+p[2]]||IMG.b_skirt_black,t=IMG['t_'+p[1]]||IMG.t_shirt_white;b&&g.drawImage(b,0,0);t&&g.drawImage(t,0,0)}
  const f=IMG['f_'+fc];f&&g.drawImage(f,0,0);
  ACCS.filter(x=>(accs||[]).includes(x.id)).forEach(a=>{if(a&&a.cv)g.drawImage(a.cv,a.x||0,a.y||0)});
  return SPR[key]=c.toDataURL();
}

let AC,bgmT=null,stp=0;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f,t,d,type='square',v=.06){const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
const seq=(fs,gap,type,v)=>{try{const t=ac().currentTime;fs.forEach((f,i)=>tone(f,t+i*gap,gap*1.6,type,v))}catch(e){}};
const sfx={coin:()=>seq([988,1319],.08,'square',.06),level:()=>seq([523,659,784,1047,1319,1568],.1,'square',.06),buy:()=>seq([1175,1568,2093],.07,'triangle',.1),tap:()=>seq([660],.05,'triangle',.08)};
const MEL=[523,0,659,0,784,659,523,0,587,0,698,0,784,698,587,0,659,0,784,0,880,784,659,0,523,0,587,659,523,0,0,0];
const BAS=[131,0,0,0,196,0,0,0,175,0,0,0,196,0,0,0,131,0,0,0,196,0,0,0,175,0,0,0,131,0,0,0];
function bgm(on){clearInterval(bgmT);bgmT=null;$('bgm').textContent=on?"🎵 BGM 켬":"🎵 BGM 끔";if(!on)return;try{ac()}catch(e){return}bgmT=setInterval(()=>{try{const t=ac().currentTime,i=stp++%32;if(MEL[i])tone(MEL[i],t,.18,'square',.025);if(BAS[i])tone(BAS[i],t,.35,'triangle',.07)}catch(e){}},210)}
$('bgm').onclick=()=>bgm(!bgmT);

const KEY="pixel-life-v3";
const def=()=>({nick:"모험가"+Math.floor(Math.random()*900+100),xp:0,spent:0,streak:0,last:"",done:{},quests:[],
 owned:FREE.slice(),outfit:'s:shirt_white:skirt_black',wear:{mode:'set',dress:'black',top:'shirt_white',bot:'skirt_black',face:'smile'},equip:{ears:'ears',face:'glasses'},v:7,place:'home',bonus:{}});
const DEFQ=[[1,'물 한 잔 마시기',5,'home'],[3,'책 읽기 20분',15,'home'],[4,'방 5분 정리',10,'home'],[5,'설거지 하기',10,'home'],[6,'가장 중요한 일 1시간 집중',30,'office'],[7,'메일·메신저 정리',10,'office'],[8,'내일 일정 정리',10,'office'],[2,'운동 30분',20,'gym'],[9,'스트레칭 10분',10,'gym'],[10,'러닝 또는 걷기 20분',20,'gym'],[11,'산책 20분',15,'park'],[12,'햇빛 쬐기 10분',10,'park']];
const PL={home:'🏠 우리 집',office:'💼 사무실',gym:'🏋️ 운동센터',park:'🌳 공원'};
function mig(){S.bonus=S.bonus||{};S.equip=S.equip||{};S.owned=S.owned||[];S.quests.forEach(q=>{if(!q.place)q.place=q.id===2?'gym':'home'});
 if(!(S.v>=4)){const fresh=!S.quests.length;DEFQ.forEach(([id,name,xp,place])=>{if(!S.quests.find(q=>q.id===id)&&(fresh||id>4))S.quests.push({id,name,xp,place})});S.v=4}
 if(!(S.v>=5)){S.owned=S.owned.filter(id=>{if(id in OLD_DRESS){S.spent=Math.max(0,S.spent-OLD_DRESS[id]);return false}return true});S.wear={top:'shirt_white',bot:'skirt_black'};S.equip=S.equip||{};S.equip.face='glasses';S.v=5}
 FREE.forEach(id=>{if(!S.owned.includes(id))S.owned.push(id)});
 if(!S.wear||!TOPS.find(x=>x.id===S.wear.top)||!BOTS.find(x=>x.id===S.wear.bot))S.wear={top:'shirt_white',bot:'skirt_black'};
 const w=S.wear;if(!w.mode)w.mode='set';if(!DRESSES.find(x=>x.id===w.dress))w.dress='black';if(!FACES.find(x=>x.id===w.face))w.face='smile';if(!(S.v>=7)){S.equip.ears='ears';S.v=7}
 Object.keys(S.equip).forEach(k=>{if(!ACCS.find(a=>a.id===S.equip[k]))delete S.equip[k]});
 S.outfit=codeOf(S.wear);if(!PL[S.place])S.place='home'}
let S,ref=null,pref=null,uid=null,rank=[],saveT;
try{S=Object.assign(def(),JSON.parse(localStorage.getItem(KEY)||"null")||{})}catch(e){S=def()}

const day=(d=new Date())=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
const T=day(),Y=day(new Date(Date.now()-864e5));
const lvOf=x=>Math.floor(x/100)+1,stg=l=>l>=8?3:l>=5?2:l>=3?1:0,TITLE=["새싹","모험가","용사","전설"];
function save(){S.outfit=codeOf(S.wear);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 clearTimeout(saveT);saveT=setTimeout(()=>{if(!ref)return;ref.set(S).catch(()=>{});pref.set({nick:S.nick,xp:S.xp,level:lvOf(S.xp),streak:S.streak,outfit:S.outfit}).catch(()=>{})},800)}

function img(s,cls){const i=new Image();i.src=s;if(cls)i.className=cls;return i}
function shopRow(host,im,name,cost,id,isOn,act){const r=document.createElement('div');r.className="row";r.appendChild(im);
 const n=document.createElement('span');n.className="nm";n.textContent=name;r.appendChild(n);
 const own=S.owned.includes(id)||cost===0,b=document.createElement('button');b.className="btn m";b.textContent=isOn?"입는 중":own?"입기":cost+"P";b.disabled=isOn||(!own&&(S.xp-S.spent)<cost);
 b.onclick=()=>{if(!own&&cost>0){S.spent+=cost;S.owned.push(id);sfx.buy()}else sfx.tap();act();save();render()};r.appendChild(b);host.appendChild(r)}
function render(){
  if(S.last&&S.last!==T&&S.last!==Y)S.streak=0;
  const lv=lvOf(S.xp),st=stg(lv),done=S.done[T]||[];
  $('lv').textContent="Lv."+lv+" "+TITLE[st]+" · "+(S.xp%100)+"/100";$('fill').style.width=(S.xp%100)+"%";
  $('coins').textContent=S.xp-S.spent;$('streak').textContent=S.streak+"일";$('today').textContent=done.length+"/"+S.quests.length;
  $('bgi').src=BGIMG[S.place]||BGIMG.home;
  const pb=$('places');pb.innerHTML='';Object.keys(PL).forEach(k=>{const b=document.createElement('button');b.className='btn'+(S.place===k?' on':'');b.textContent=PL[k];b.onclick=()=>{S.place=k;sfx.tap();save();render()};pb.appendChild(b)});
  const ch=$('char');ch.className="char"+(st?" a"+st:"");ch.innerHTML="";ch.appendChild(img(sprite(codeOf(S.wear),Object.values(S.equip)),"base"));
  if(st>=1)[[-30,10],[105,18],[100,60],[-25,55]].slice(0,st+1).forEach(([x,y],i)=>{const s=document.createElement('span');s.className="sp";s.textContent="✦";s.style.left=x+"%";s.style.top=y+"%";s.style.animationDelay=i*.4+"s";ch.appendChild(s)});
  const qs=$('quests');qs.innerHTML="";
  const pq=S.quests.filter(q=>q.place===S.place);$('qh').textContent=PL[S.place]+' 퀘스트 ('+pq.filter(q=>done.includes(q.id)).length+'/'+pq.length+')';
  pq.forEach(q=>{const d=done.includes(q.id),e=document.createElement('button');e.className="q"+(d?" done":"");
    e.innerHTML='<span class="box">'+(d?"✓":"")+'</span><span class="nm"></span><span class="xp">+'+q.xp+'</span>';e.querySelector('.nm').textContent=q.name;
    e.onclick=()=>complete(q);e.oncontextmenu=ev=>{ev&&ev.preventDefault&&ev.preventDefault();dlg('"'+q.name+'" 퀘스트를 삭제할까요?',()=>{S.quests=S.quests.filter(x=>x.id!==q.id);save();render()},"삭제")};
    let lp;e.ontouchstart=()=>{lp=setTimeout(()=>e.oncontextmenu(),700)};e.ontouchend=e.ontouchmove=()=>clearTimeout(lp);qs.appendChild(e)});
  ['top','bot','dress','face','acc'].forEach(k=>$('s-'+k).innerHTML="");
  const W=S.wear;
  const set=W.mode!=='dress';
  TOPS.forEach(o=>shopRow($('s-top'),img(sprite('s:'+o.id+':'+W.bot),"body"),o.name,o.cost,o.id,set&&W.top===o.id,()=>{W.mode='set';W.top=o.id}));
  BOTS.forEach(o=>shopRow($('s-bot'),img(sprite('s:'+W.top+':'+o.id),"body"),o.name,o.cost,o.id,set&&W.bot===o.id,()=>{W.mode='set';W.bot=o.id}));
  DRESSES.forEach(o=>shopRow($('s-dress'),img(sprite('d:'+o.id),"body"),o.name,o.cost,o.id,!set&&W.dress===o.id,()=>{W.mode='dress';W.dress=o.id}));
  FACES.forEach(o=>{shopRow($('s-face'),img(sprite(codeOf(Object.assign({},W,{face:o.id}))),"face"),o.name,0,o.id,W.face===o.id,()=>{W.face=o.id});const b=$('s-face').lastChild.querySelector('button');if(W.face!==o.id){b.textContent='고르기';b.disabled=false}});
  ACCS.forEach(a=>{const on=S.equip[a.slot]===a.id;const r0=$('s-acc').childElementCount;
    shopRow($('s-acc'),img(a.img,"it"),a.name,a.cost,a.id,false,()=>{if(on)delete S.equip[a.slot];else S.equip[a.slot]=a.id});
    if(on){const b=$('s-acc').lastChild.querySelector('button');b.textContent="벗기"}});
  $('nick').value=S.nick;renderRank();

function renderRank(){
  const el=$('rank');el.innerHTML="";
  if(!ref){$('rnote').textContent="랭킹은 로그인 후 공유 링크로 접속하면 켜져요. 지금은 이 기기에만 저장 중이에요.";return}
  $('rnote').textContent="기록은 자동 동기화돼요. 같은 계정이면 다른 기기에서도 이어서 할 수 있어요.";
  rank.forEach((p,i)=>{const r=document.createElement('div');r.className="row"+(p.id===uid?" me":"");r.appendChild(img(sprite(p.outfit)));
    const n=document.createElement('span');n.className="nm";n.textContent=(["🥇","🥈","🥉"][i]||(i+1)+".")+" "+(p.nick||"익명");r.appendChild(n);
    const l=document.createElement('span');l.style.fontSize="13px";l.textContent="Lv."+(p.level||1)+" · "+(p.xp||0);r.appendChild(l);el.appendChild(r)});
}
function complete(q){
  S.done[T]=S.done[T]||[];if(S.done[T].includes(q.id))return;
  const before=lvOf(S.xp);S.done[T].push(q.id);S.xp+=q.xp;
  if(S.last!==T){S.streak=(S.last===Y)?S.streak+1:1;S.last=T}
  let msg='+'+q.xp+' XP';const pq2=S.quests.filter(x=>x.place===q.place);
  if(pq2.every(x=>S.done[T].includes(x.id))&&!S.bonus[T+q.place]){S.bonus[T+q.place]=1;S.xp+=10;msg+=' · 클리어 +10';setTimeout(()=>sfx.level(),250)}
  save();render();
  const c=$('char');c.classList.remove('bounce');void c.offsetWidth;c.classList.add('bounce');
  const p=document.createElement('div');p.className="pop";p.textContent=msg;$('stage').appendChild(p);setTimeout(()=>p.remove(),1000);
  if(lvOf(S.xp)>before){sfx.level();setTimeout(()=>dlg("🎊 레벨 업! Lv."+lvOf(S.xp)+" "+TITLE[stg(lvOf(S.xp))]),400)}else sfx.coin();
}
